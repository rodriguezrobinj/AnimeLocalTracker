name: CI & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# DEV-07: un solo run por rama — un push nuevo cancela el anterior (mismo código) y
# ninguno puede colgarse más de 45 min (el default de 6 h agota runners sin razón).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & SCA Security Audit
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive

    # DEV-01: caché de builds para reducir tiempos (Rust release ~3 min ahorrables por run)
    - name: Cache Cargo Registry + Rust Target + Cargo Bin
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/bin
          native/animetracker_core/target
        key: cargo-${{ runner.os }}-${{ hashFiles('native/animetracker_core/Cargo.lock') }}

    - name: Cache NuGet Packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (frozen)

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Tools and Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e tools/python

    # ── SCA BLOQUEANTES (DEV-01): cualquier vulnerabilidad conocida rompe el CI ──
    - name: Cargo Security Audit (Rust SCA)
      working-directory: native/animetracker_core
      run: |
        # DEV-01b: versión pineada para runs reproducibles
        cargo install cargo-audit --locked --version 0.22.2
        cargo audit

    - name: Python SCA Audit (pip-audit)
      run: |
        # La imagen de Python de GitHub trae setuptools 65.5.0 (7 CVEs conocidas):
        # actualizarlo antes de auditar, si no el audit falla por el entorno, no por el proyecto
        python -m pip install --upgrade setuptools pip
        # DEV-01b: versión pineada para runs reproducibles
        python -m pip install pip-audit==2.10.1
        pip-audit

    - name: NuGet SCA Audit (dotnet)
      run: dotnet list AnimeLocalTracker/AnimeLocalTracker.csproj package --vulnerable --include-transitive

    - name: Build Rust Native Library
      run: |
        cargo build --release --manifest-path native/animetracker_core/Cargo.toml
        Copy-Item native/animetracker_core/target/release/animetracker_core.dll AnimeLocalTracker/animetracker_core.dll -Force

    - name: Build Solution and Run Tests with Coverage
      env:
        # DEV-08: builds deterministas en CI (mismos bits que la release)
        ContinuousIntegrationBuild: 'true'
      run: |
        powershell -ExecutionPolicy Bypass -File .\build.ps1 -RunTests -Coverage

    # DEV-06b: umbral de cobertura de líneas. Medido: 46.9%
    # (2026-09-01, excluyendo el ensamblado de tests; subió desde 43.1% con los
    # tests de AniSkipService). SUBIR este umbral conforme crezca la cobertura.
    - name: Check Coverage Threshold (>= 45%)
      shell: powershell
      run: |
        $threshold = 0.45
        $cov = Get-ChildItem "AnimeLocalTracker.Tests/TestResults" -Recurse -Filter "coverage.cobertura.xml" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if (-not $cov) { Write-Host "::error::No se encontró coverage.cobertura.xml"; exit 1 }
        [xml]$xml = Get-Content $cov.FullName
        $rate = [double]$xml.coverage.'line-rate'
        $pct = [math]::Round($rate * 100, 1)
        Write-Host "Cobertura de líneas: $pct% (umbral: $([math]::Round($threshold * 100))%)"
        if ($rate -lt $threshold) {
          Write-Host "::error::Cobertura por debajo del umbral ($pct% < $([math]::Round($threshold * 100))%)"
          exit 1
        }

    - name: Upload Test Results and Coverage Report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: test-and-coverage
        path: |
          AnimeLocalTracker.Tests/TestResults/**/*.xml
          AnimeLocalTracker.Tests/TestResults/**/*.trx
        if-no-files-found: warn
