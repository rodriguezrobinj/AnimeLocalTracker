name: Release

# DEV-02: release automática — crear un tag vX.Y.Z en GitHub dispara:
# build → tests → empaquetado Velopack (Setup/Portable/nupkg/delta) → subida al Release.
# Las aplicaciones instaladas se actualizan solas con los deltas.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

# DEV-07: nunca dos releases en paralelo; sin cancel-in-progress para no
# interrumpir una subida a mitad (los runs siguientes se encolan).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, Test & Publish Release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Cache Cargo Registry + Rust Target + Cargo Bin
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/bin
          native/animetracker_core/target
        key: cargo-${{ runner.os }}-${{ hashFiles('native/animetracker_core/Cargo.lock') }}

    - name: Cache NuGet Packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.x'

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (frozen)

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: tools/python/requirements.txt

    - name: Install Python Tools and Dependencies
      run: |
        python -m pip install --upgrade pip
        # SEC-04: dependencias del daemon fijadas con hashes SHA-256 (tools/python/requirements.txt, generado con
        # pip-compile a partir de pyproject.toml + requirements.in). Un paquete cuyo contenido cambie en PyPI sin
        # cambiar de versión, o una versión nueva no revisada, hace fallar la instalación en vez de colarse en el build.
        python -m pip install --require-hashes -r tools/python/requirements.txt
        python -m pip install --no-deps -e tools/python

    # ARC-14: los tests del daemon Python bloquean también el corte de release.
    - name: Python Unit Tests (pytest)
      run: |
        python -m pip install pytest
        python -m pytest tools/python/tests -q

    # ── SCA BLOQUEANTES (CI-07/TST-06): la release no se corta con vulnerabilidades
    # ── conocidas detectadas en el momento del corte ──
    - name: Cargo Security Audit (Rust SCA)
      working-directory: native/animetracker_core
      run: |
        # CI-01: la caché restaura ~/.cargo/bin pero no ~/.cargo/.crates.toml, y `cargo install` fallaba con
        # "binary cargo-audit.exe already exists". Se instala solo si falta la versión fijada.
        $versionInstalada = (& cargo audit --version 2>$null) -join ' '
        if ($versionInstalada -notmatch '0\.22\.2') {
          cargo install cargo-audit --locked --version 0.22.2 --force
        }
        cargo audit

    - name: Python SCA Audit (pip-audit)
      run: |
        python -m pip install --upgrade setuptools pip
        python -m pip install pip-audit==2.10.1
        pip-audit

    - name: NuGet SCA Audit (dotnet)
      run: |
        dotnet restore AnimeLocalTracker/AnimeLocalTracker.csproj --nologo
        dotnet list AnimeLocalTracker/AnimeLocalTracker.csproj package --vulnerable --include-transitive

    # SEC-09: el proyecto de tests también se audita en el corte de release.
    - name: NuGet SCA Audit (dotnet Tests)
      run: |
        dotnet restore AnimeLocalTracker.Tests/AnimeLocalTracker.Tests.csproj --nologo
        dotnet list AnimeLocalTracker.Tests/AnimeLocalTracker.Tests.csproj package --vulnerable --include-transitive

    - name: Build Rust Native Library
      run: |
        cargo build --release --manifest-path native/animetracker_core/Cargo.toml
        Copy-Item native/animetracker_core/target/release/animetracker_core.dll AnimeLocalTracker/animetracker_core.dll -Force

    # Gate de calidad: la release no se empaqueta si los tests fallan
    - name: Build Solution and Run Tests
      env:
        # DEV-08: builds deterministas en CI (mismos bits en cada release)
        ContinuousIntegrationBuild: 'true'
      run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -RunTests

    # vpk solo genera el delta si encuentra los paquetes anteriores en Releases/.
    # En un runner limpio no existen → descargar los nupkg de la release previa.
    - name: Download Previous Release Assets (para el delta)
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # DEV-11: el tag previo se elige por orden semver (git tag --sort=-v:refname),
        # NO por gh release list --limit 1 (podía elegir una release equivocada), y solo
        # se bajan los *.nupkg (el delta de vpk no necesita Setup.exe/Portable.exe).
        git fetch --tags --force --quiet
        $current = $env:GITHUB_REF_NAME
        $prevTag = $null
        foreach ($tag in (git tag --sort=-v:refname | Where-Object { $_ -match '^v[0-9]' -and $_ -ne $current })) {
            if (gh release view $tag --json tagName --jq '.tagName' 2>$null) { $prevTag = $tag; break }
        }
        if ($prevTag) {
          New-Item -ItemType Directory -Path Releases -Force | Out-Null
          Write-Host "Descargando nupkg de la release previa: $prevTag"
          gh release download $prevTag --dir Releases --pattern "*.nupkg"
        } else {
          Write-Host "Sin release previa: se generará solo el paquete completo."
        }

    # SEC-05: firma de código. Requiere provisionar el certificado en los secrets
    # SIGN_CERT_BASE64 / SIGN_CERT_PASSWORD. Sin secrets, la release sale SIN firmar
    # (en vez de abortar el empaquetado) para no bloquear la publicación mientras se
    # consigue el certificado — el aviso queda visible en el propio Release de GitHub
    # (ver paso "Upload to GitHub Release"). En cuanto se configuren los secrets, este
    # mismo paso vuelve a firmar automáticamente sin más cambios.
    # NOTA: GitHub no permite referenciar secrets en `if:` — se maneja en el script.
    - name: Prepare Code Signing Certificate
      id: cert
      shell: powershell
      env:
        CERT_B64: ${{ secrets.SIGN_CERT_BASE64 }}
        CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
      run: |
        if (-not $env:CERT_B64) {
          Write-Host "::warning::Sin certificado configurado (SEC-05): la release se publica SIN firmar. Configura SIGN_CERT_BASE64/SIGN_CERT_PASSWORD en los secrets del repo para firmar releases futuras."
          Write-Output "cert_ready=false" >> $env:GITHUB_OUTPUT
        } else {
          $pfx = Join-Path $env:RUNNER_TEMP "alt.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          Add-Content -Path $env:GITHUB_ENV -Value "SIGN_CERT_PATH=$pfx"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGN_CERT_PASSWORD=$env:CERT_PASSWORD"
          Write-Output "cert_ready=true" >> $env:GITHUB_OUTPUT
        }

    - name: Package Velopack Release
      shell: powershell
      run: |
        $version = $env:GITHUB_REF_NAME.TrimStart('v')
        Write-Host "Empaquetando versión $version desde tag $env:GITHUB_REF_NAME"
        powershell -ExecutionPolicy Bypass -File .\build_velopack_release.ps1 -Version $version

    - name: Verify Code Signing
      if: steps.cert.outputs.cert_ready == 'true'
      shell: powershell
      # Antes se comprobaba "Releases\Setup.exe", pero vpk lo genera como AnimeLocalTracker-win-Setup.exe (el paso
      # fallaba siempre) y solo miraba el instalador. Ahora se verifica el instalador Y los binarios propios de
      # dentro (exe, núcleo Rust, motor Python), exigiendo firma válida y sello de tiempo.
      run: powershell -ExecutionPolicy Bypass -File .\tools\Test-ReleaseSignature.ps1 -ReleasesDir Releases

    - name: Upload to GitHub Release (Pre-release)
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = $env:GITHUB_REF_NAME.TrimStart('v')
        $sinFirma = '${{ steps.cert.outputs.cert_ready }}' -ne 'true'
        $titulo = "AnimeLocalTracker v$version (Pre-release)"
        if ($sinFirma) { $titulo += " [SIN FIRMAR]" }

        gh release create $env:GITHUB_REF_NAME Releases/* `
          --title $titulo `
          --prerelease `
          --generate-notes

        # SEC-05: deja constancia visible para el usuario final de que este release en
        # particular no está firmado (en vez de solo un log de CI que nadie más ve).
        if ($sinFirma) {
          $aviso = "> [!WARNING]`n> **Este instalador no está firmado digitalmente** (falta configurar el certificado de firma de código en los secrets del repositorio). Windows SmartScreen puede mostrar ``Windows protegió su PC`` al ejecutarlo — es esperado y no indica que el archivo esté comprometido.`n`n"
          $notasActuales = gh release view $env:GITHUB_REF_NAME --json body -q .body
          gh release edit $env:GITHUB_REF_NAME --notes ($aviso + $notasActuales)
        }
