name: Benchmarks (manual / semanal)

# OPS-01: los benchmarks de rendimiento existían pero nunca se ejecutaban ni en CI ni de
# forma persistida. Este workflow genera la línea base y el historial comparativo (aquí ±30 %; ±5 % en local):
#   - manualmente desde Acciones (workflow_dispatch), o
#   - automáticamente cada lunes a las 03:00 UTC.
# No bloquea pushes: es un job informativo que sube los reportes como artefacto.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  actions: read   # para bajar el historial que dejó la ejecución anterior

jobs:
  benchmarks:
    name: BenchmarkDotNet (reproductor/db/scanner)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.x'

    # Cada ejecución arranca en una máquina limpia y BenchmarkHistory/ no está en el repo: sin esto no había con qué comparar y
    # todos los benchmarks salían siempre como "NUEVO". Se recupera el historial de la última ejecución en verde (los artefactos
    # duran 90 días); el paso de subida de abajo lo vuelve a guardar ya con esta ejecución añadida. Si no hay ninguna, o su
    # artefacto caducó, se sigue sin historial: esta ejecución queda como línea base.
    - name: Restore Previous Benchmark History
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $anterior = gh run list --workflow benchmarks.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
        if ($anterior) {
          gh run download $anterior --name benchmark-history --dir BenchmarkHistory
          if ($LASTEXITCODE -eq 0) { Write-Host "Historial recuperado de la ejecucion $anterior." }
          else { Write-Host "::warning::No se pudo bajar el historial de la ejecucion $anterior; esta queda como linea base." }
        } else {
          Write-Host "No hay ejecucion anterior en verde: esta queda como linea base."
        }
        exit 0

    - name: Run Benchmarks and Generate Reports
      shell: powershell
      env:
        # El historial comparativo vive en la raíz del repo (misma ruta que usa el script).
        ANIMELOCALTRACKER_BENCH_HISTORY: ${{ github.workspace }}/BenchmarkHistory
        # Aquí cada ejecución cae en una máquina distinta: el mismo código varía entre un 7 y un 26 % (medido). Con el 5 % de
        # fábrica saldrían regresiones falsas casi cada semana; solo se marca lo que cambie un 30 % o más.
        ANIMELOCALTRACKER_BENCH_UMBRAL: '30'
      run: |
        powershell -ExecutionPolicy Bypass -File .\run_benchmarks_and_reports.ps1 -Target benchmarks -BenchmarkCategory 4

    - name: Upload Benchmark History
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: benchmark-history
        path: BenchmarkHistory/**
        retention-days: 90
        if-no-files-found: warn
