version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      flyleaf:
        patterns:
          - "Flyleaf*"
    ignore:
      # Fijado a una compilación de CI porque FlyleafLib.Controls.WPF lo exige (ver el comentario en AnimeLocalTracker.csproj):
      # que Dependabot no proponga otra compilación de CI sin revisar.
      - dependency-name: "MaterialDesignThemes"
      - dependency-name: "MaterialDesignColors"

  - package-ecosystem: "cargo"
    directory: "/native/animetracker_core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/tools/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
