[project]
name = "animetracker-tools"
version = "1.0.0"
description = "Motor de automatizacion, extraccion de streams y benchmarks para AnimeLocalTracker."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp==2026.8.19",
    "playwright>=1.45.0",
    "pydantic>=2.7.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["media*", "resolvers*", "automation*"]

[tool.setuptools]
py-modules = ["cli", "build_binary"]
